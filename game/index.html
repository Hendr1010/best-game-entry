<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#050913">
  <title>NEON VOID // Starfighter</title>
  <style>
    :root { color-scheme: dark; font-family: 'Courier New', monospace; background: #030711; color: #eafaff; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, #101a2c 0, #070c18 48%, #030711 100%); }
    .frame { position: relative; width: min(100vw, calc(100vh * 1.5)); aspect-ratio: 3 / 2; overflow: hidden; border: 1px solid rgba(86, 242, 255, .35); box-shadow: 0 0 40px rgba(31, 170, 206, .14), inset 0 0 24px rgba(34, 127, 166, .08); background: #050913; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    #hud { position: absolute; inset: 0; pointer-events: none; }
    .hud-top, .hud-bottom { position: absolute; left: 26px; right: 26px; display: flex; align-items: flex-start; gap: 42px; }
    .hud-top { top: 19px; } .hud-bottom { bottom: 18px; align-items: flex-end; }
    .hud-top > div, .hud-bottom > div { display: flex; flex-direction: column; gap: 4px; min-width: 80px; }
    .hud-top .wave { margin-left: auto; padding-right: 72px; text-align: right; }
    .label { color: #8298b3; font-size: 10px; letter-spacing: 1px; }
    .hud-top b { font-size: 18px; color: #d8fbff; font-weight: 600; text-shadow: 0 0 10px rgba(85, 246, 255, .38); }
    .hud-bottom b { font-size: 17px; font-weight: 600; }
    .lives { color: #ff4eaa; letter-spacing: 4px; }.defense { color: #55f6ff; }.combo { color: #ffad52; font-size: 13px; }.combo b { color: #ffdc87; }.timer { margin-left: auto; color: #9aadc3; font-size: 12px; }
    #sound { position: absolute; top: 17px; right: 16px; z-index: 2; border: 1px solid rgba(129, 158, 185, .28); background: rgba(5, 12, 25, .78); color: #a7bbcf; padding: 7px 10px; font: 11px 'Courier New', monospace; cursor: pointer; }
    #sound:hover { color: #55f6ff; border-color: #55f6ff; }
    .scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(150, 225, 255, .018) 4px); mix-blend-mode: screen; }
    @media (max-width: 600px) { .hud-top, .hud-bottom { left: 12px; right: 12px; gap: 12px; }.hud-top .wave { padding-right: 0; }.label { font-size: 8px; }.hud-top b, .hud-bottom b { font-size: 12px; }.hud-top > div, .hud-bottom > div { min-width: 50px; }.lives { letter-spacing: 1px; } #sound { top: 58px; right: 10px; } }
  </style>
</head>
<body>
  <main class="frame" aria-label="Neon Void arcade game">
    <canvas id="game" width="960" height="640" aria-label="NEON VOID game canvas"></canvas>
    <div id="hud" aria-live="polite"></div>
    <button id="sound" type="button" aria-label="Toggle sound">♪ ON</button>
    <div class="scan"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
